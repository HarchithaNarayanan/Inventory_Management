# ============================================================
# Inventory Management System — Application Configuration
# Spring Boot 3.2.5 | Java 17 | MySQL 8
# ============================================================

spring.application.name=inventory-management

# ============================================================
# DATABASE — MySQL Connection
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / HIBERNATE
# ============================================================
# update = creates tables if not exist, alters columns if schema changes
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL in console (useful during development)
spring.jpa.show-sql=true

# Pretty-print the SQL statements
spring.jpa.properties.hibernate.format_sql=true

# MySQL 8 dialect — ensures correct SQL generation for MySQL 8+
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ============================================================
# SERVER
# ============================================================
server.port=8080

# ============================================================
# LOGGING
# ============================================================
logging.level.com.inventory=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# JWT CONFIGURATION
# ============================================================
# Secret key — Base64-encoded 256-bit HMAC-SHA256 signing key.
# IMPORTANT: Change this to a strong random key in production.
# Generate with: openssl rand -base64 32
app.jwt.secret=aGVsbG9Xb3JsZEludmVudG9yeU1hbmFnZW1lbnRTeXN0ZW0yMDI2U2VjcmV0

# Token expiration in milliseconds: 86400000 = 24 hours
app.jwt.expiration=86400000

# ============================================================
# SPRING SECURITY LOGGING (helpful during development)
# ============================================================
logging.level.org.springframework.security=DEBUG
